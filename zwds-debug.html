  0x092e0,0x0d2e3,0x0c960,0x0d557,0x0d4a0,0x0da50,0x05d55,0x056a0,0x0a6d0,0x055d4,//2060-2069
  0x052d0,0x0a9b8,0x0a950,0x0b4a0,0x0b6a6,0x0ad50,0x055a0,0x0aba4,0x0a5b0,0x052b0,//2070-2079
  0x0b273,0x06930,0x07337,0x06aa0,0x0ad50,0x14b55,0x04b60,0x0a570,0x054e4,0x0d160,//2080-2089
  0x0e968,0x0d520,0x0daa0,0x16aa6,0x056d0,0x04ae0,0x0a9d4,0x0a4d0,0x0d150,0x0f252,//2090-2099
  0x0d520                                                                                //2100

const Gan = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const Zhi = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];

function lYearDays(y) {
  let i, sum = 348;
  const info = lunarInfo[y - 1900];
  for(i = 0x8000; i > 0x8; i >>= 1) sum += (info & i) ? 1 : 0;
  return sum + leapDays(y);
}

function leapMonth(y) {
  return lunarInfo[y - 1900] & 0xf;
}

function leapDays(y) {
  if(leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29;
  return 0;
}

function monthDays(y, m) {
  return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29;
}

// 公历月天数
const solarDays = [31,28,31,30,31,30,31,31,30,31,30,31];

function solar2lunar(y, m, d) {
  // 基准：1900-01-31 = 农历庚子年正月初一
  let offset = (Date.UTC(y, m-1, d) - Date.UTC(1900, 0, 31)) / 86400000;
  
  let lY, i, temp = 0;
  for(lY = 1900; lY < 2101 && offset > 0; lY++) {
    temp = lYearDays(lY);
    offset -= temp;
  }
  if(offset < 0) { offset += temp; lY--; }
  
  let leap = leapMonth(lY);
  let isLeap = false;
  
  for(i = 1; i < 13 && offset > 0; i++) {
    if(leap > 0 && i === (leap + 1) && !isLeap) {
      --i;
      isLeap = true;
      temp = leapDays(lY);
    } else {
      temp = monthDays(lY, i);
    }
    if(isLeap && i === (leap + 1)) isLeap = false;
    offset -= temp;
  }
  
  if(offset === 0 && leap > 0 && i === leap + 1) {
    if(isLeap) { isLeap = false; } else { isLeap = true; --i; }
  }
  if(offset < 0) { offset += temp; --i; }
  
  const lM = i;
  const lD = offset + 1;
  
  const gzY = cyclical((lY - 4) % 60);
  const gzM = cyclical((lY - 1900) * 12 + lM + 12);
  const gzD = cyclical(Math.floor((Date.UTC(y, m-1, d) - Date.UTC(1900, 0, 1)) / 86400000) + 9);
  
  return {
    lYear: lY, lMonth: lM, lDay: lD, isLeap: !!isLeap,
    yearStem: gzY.stem, yearBranch: gzY.branch,
    monthStem: gzM.stem, monthBranch: gzM.branch,
    dayStem: gzD.stem, dayBranch: gzD.branch,
  };
  
  function cyclical(num) {
    return { stem: Gan[num % 10], branch: Zhi[num % 12], stemIdx: num % 10, branchIdx: num % 12 };
  }
}

// ===== 验证农历转换 =====
function log(t) { document.getElementById('log').textContent += t + '\n'; }

log('=== 农历转换验证 ===');
let tests = [
  ['1988/2/2', 1988,2,2],
  ['1988/2/17', 1988,2,17], // 除夕

  ['2024/2/9', 2024,2,9],
  ['2024/2/10', 2024,2,10],
];

for(let t of tests) {
  let r = solar2lunar(t[1], t[2], t[3]);
  log(t[0] + ' → 农历' + r.lYear + '年' + (r.isLeap?'闰':'') + r.lMonth + '月' + r.lDay + '日 (' + r.yearStem + r.yearBranch + '年 ' + r.monthStem + r.monthBranch + '月 ' + r.dayStem + r.dayBranch + '日)');
}

log('');

// ===== 2. 正确排盘 =====
log('=== 排盘计算 ===');
log('');

function calculateZWDS(solarYear, solarMonth, solarDay, hourIdx) {
  const lunar = solar2lunar(solarYear, solarMonth, solarDay);
  const lY = lunar.lYear, lM = lunar.lMonth, lD = lunar.lDay;
  
  log('输入: ' + solarYear + '/' + solarMonth + '/' + solarDay + ' 时' + hourIdx);
  log('农历: ' + lY + '年' + lM + '月' + lD + '日');
  log('年干支: ' + lunar.yearStem + lunar.yearBranch + ' | 月干支: ' + lunar.monthStem + lunar.monthBranch + ' | 日干支: ' + lunar.dayStem + lunar.dayBranch);
  
  // 2.1 定命宫：从寅宫(2)起正月，逆数到生月 → 从生月顺数到生时
  // 正确公式：从寅(2)起正月，顺数到生月 → 从生月位置 逆数到 生时 = 命宫
  // 公式: 命宫地支 = (2 + (lM-1) - hourIdx + 12) % 12
  // 更准确: 寅上起正月，顺数到生月；从生月逆数到生时
  const monthPos = (2 + (lM - 1)) % 12; // 寅(2) + 顺数月
  const lifePos = (monthPos - hourIdx + 12) % 12;
  
  log('命宫地支: ' + EARTHLY_BRANCHES[lifePos] + '宫 (地支index=' + lifePos + ')');
  
  // 2.2 定身宫：从寅宫起正月，顺数到生月 → 从生月顺数到生时
  const bodyPos = (monthPos + hourIdx) % 12;
  log('身宫地支: ' + EARTHLY_BRANCHES[bodyPos] + '宫');
  
  // 2.3 安十二宫（从命宫地支开始，逆时针排）
  let palaces = [];
  for(let i = 0; i < 12; i++) {
    let dzIdx = (lifePos - i + 12) % 12;
    palaces.push({
      position: i,                           // 0=命宫,1=兄弟宫...
      dzIndex: dzIdx,                        // 对应的地支索引
      dzName: EARTHLY_BRANCHES[dzIdx] + '宫', // 子宫、丑宫...
      name: PALACE_NAMES_CYCLE[i],
      nameEn: ['命宮','兄弟宮','夫妻宮','子女宮','財帛宮','疾厄宮','遷移宮','仆役宮','官祿宮','田宅宮','福德宮','父母宮'][i],
    });
  }
  
  log('');
  log('十二宫定位:');
  palaces.forEach(p => log('  [' + p.name + '] → ' + p.dzName));
  
  // 2.4 五虎遁定十二宫天干
  // 甲己之年丙作首(2), 乙庚之岁戊为头(4), 丙辛必定寻庚起(6), 丁壬壬位顺行流(8), 若问戊癸何方发(甲寅之上好追求)(0)
  const wuHuStart = [2, 4, 6, 8, 0][lunar.yearStemIdx % 5];
  const lifeStem = (wuHuStart + lifePos) % 10;
  log('');
  log('五虎遁: 年干' + lunar.yearStem + ' → 寅宫干' + HEAVENLY_STEMS[wuHuStart] + ' → 命宫干' + HEAVENLY_STEMS[lifeStem]);
  
  palaces.forEach(p => {
    p.stem = HEAVENLY_STEMS[(wuHuStart + p.dzIndex) % 10];
    p.stemBranch = p.stem + EARTHLY_BRANCHES[p.dzIndex];
  });
  log('');
  palaces.forEach(p => log('  ' + p.name + ' → ' + p.dzName + ' → ' + p.stemBranch));
  
  // 2.5 定五行局（纳音五行）
  const sexagenaryIndex = (lifeStem * 6 - lifePos * 5 + 60 * 7) % 60;
  const NAYIN_BUREAU = [
    { element: '金', bureau: 4 }, { element: '火', bureau: 6 }, { element: '木', bureau: 3 },
    { element: '土', bureau: 5 }, { element: '金', bureau: 4 }, { element: '火', bureau: 6 },
    { element: '水', bureau: 2 }, { element: '土', bureau: 5 }, { element: '金', bureau: 4 },
    { element: '木', bureau: 3 }, { element: '水', bureau: 2 }, { element: '土', bureau: 5 },
    { element: '火', bureau: 6 }, { element: '木', bureau: 3 }, { element: '水', bureau: 2 },
    { element: '金', bureau: 4 }, { element: '火', bureau: 6 }, { element: '木', bureau: 3 },
    { element: '土', bureau: 5 }, { element: '金', bureau: 4 }, { element: '水', bureau: 2 },
    { element: '火', bureau: 6 }, { element: '水', bureau: 2 }, { element: '木', bureau: 3 },
    { element: '金', bureau: 4 }, { element: '火', bureau: 6 }, { element: '木', bureau: 3 },
    { element: '土', bureau: 5 }, { element: '金', bureau: 4 }, { element: '火', bureau: 6 },
    { element: '水', bureau: 2 }, { element: '土', bureau: 5 }, { element: '金', bureau: 4 },
    { element: '木', bureau: 3 }, { element: '水', bureau: 2 }, { element: '土', bureau: 5 },
    { element: '火', bureau: 6 }, { element: '木', bureau: 3 }, { element: '水', bureau: 2 },
    { element: '金', bureau: 4 }, { element: '火', bureau: 6 }, { element: '木', bureau: 3 },
    { element: '土', bureau: 5 }, { element: '金', bureau: 4 }, { element: '水', bureau: 2 },
    { element: '火', bureau: 6 }, { element: '水', bureau: 2 }, { element: '木', bureau: 3 },
    { element: '金', bureau: 4 }, { element: '火', bureau: 6 }, { element: '木', bureau: 3 },
    { element: '土', bureau: 5 }, { element: '金', bureau: 4 }, { element: '火', bureau: 6 },
    { element: '水', bureau: 2 }, { element: '土', bureau: 5 }, { element: '金', bureau: 4 },
    { element: '木', bureau: 3 }, { element: '水', bureau: 2 }, { element: '土', bureau: 5 },
  ];
  
  const bureauIdx = Math.floor(sexagenaryIndex / 2);
  const bureau = NAYIN_BUREAU[bureauIdx] || { element: '金', bureau: 4 };
  log('');
  log('命宫干支: ' + HEAVENLY_STEMS[lifeStem] + EARTHLY_BRANCHES[lifePos] + ' → 纳音: ' + bureau.element + bureau.bureau + '局');
  
  // 2.6 安紫微星
  // 公式：局数=起算日，从寅宫(2)起。不足则逆推，超出则顺推
  const baseDay = bureau.bureau;
  const diff = lD - baseDay;
  const ziWeiPos = ((2 + diff) % 12 + 12) % 12;
  log('紫微星: ' + EARTHLY_BRANCHES[ziWeiPos] + '宫 (起算日=' + baseDay + ', 生日=' + lD + ', 相差=' + diff + ')');
  
  // 2.7 安十四主星
  // 紫微系：紫微在ziWeiPos, 顺时针布: 紫微[0], 天机+1, [空], 太阳+3, 武曲+5, 天同+7, [空][空], 廉贞+10
  const ZI_WEI_SERIES = [
    ['紫微', 0], ['天機', 1], ['空', 2], ['太陽', 3], ['武曲', 5], ['天同', 7], ['空', 8], ['空', 9], ['廉貞', 10]
  ];
  // 天府系：天府在紫微对宫(ziWeiPos+6), 逆时针布: 天府[0], 太阴+1, 贪狼+2, 巨门+3, 天相+4, 天梁+5, 七杀+6, [空][空][空], 破军+10
  const TIAN_FU_SERIES = [
    ['天府', 0], ['太陰', 1], ['貪狼', 2], ['巨門', 3], ['天相', 4], ['天梁', 5], ['七殺', 6], ['空', 7], ['空', 8], ['空', 9], ['破軍', 10]
  ];
  
  let starsByPos = {}; // { dzIndex: [星名, ...] }
  
  // 紫微系顺时针
  for(let s of ZI_WEI_SERIES) {
    if(s[0] === '空') continue;
    let pos = (ziWeiPos + s[1]) % 12;
    if(!starsByPos[pos]) starsByPos[pos] = [];
    starsByPos[pos].push(s[0]);
  }
  
  // 天府系逆时针
  const tianFuPos = (ziWeiPos + 6) % 12; // 紫微的对宫
  for(let s of TIAN_FU_SERIES) {
    if(s[0] === '空') continue;
    let pos = (tianFuPos - s[1] + 12) % 12;
    if(!starsByPos[pos]) starsByPos[pos] = [];
    starsByPos[pos].push(s[0]);
  }
  
  log('');
  log('十四主星落宫:');
  for(let i = 0; i < 12; i++) {
    log('  ' + EARTHLY_BRANCHES[i] + '宫: ' + (starsByPos[i] ? starsByPos[i].join(' · ') : '空'));
  }
  
  // 按十二宫映射星曜
  log('');
  log('=== 十二宫主星 ===');
  palaces.forEach(p => {
    let stars = starsByPos[p.dzIndex] || [];
    log('  ' + p.name + ' (' + p.dzName + '): ' + (stars.length ? stars.join(' · ') : '空宫'));
  });
  
  // 2.8 安辅星
  const zuoFu = (4 + lM - 1) % 12;          // 左辅: 辰(4)上起正月顺数
  const youBi = (10 - lM + 1 + 12) % 12;    // 右弼: 戌(10)上起正月逆数
  const wenChang = (10 + hourIdx) % 12;      // 文昌: 戌(10)上起子时辰数顺
  const wenQu = (4 - hourIdx + 12) % 12;      // 文曲: 辰(4)上起子时逆数
  
  // 天魁: 甲戊庚牛羊(丑未), 乙己鼠猴乡(子申), 丙丁猪鸡位(亥酉), 壬癸兔蛇藏(卯巳), 辛逢虎马寅午
  const TIAN_KUI = { 0:1, 1:11, 2:3, 3:9, 4:5, 5:1, 6:11, 7:3, 8:9, 9:5 };
  // 天钺: 甲戊庚猴虎(申寅), 乙己蛇鼠(巳子), 丙丁猪鸡(亥酉), 壬癸兔蛇(卯巳), 辛逢虎马(寅午)
  const TIAN_YUE = { 0:8, 1:2, 2:10, 3:4, 4:6, 5:8, 6:2, 7:10, 8:4, 9:6 };
  
  const tianKui = TIAN_KUI[lunar.yearStemIdx];
  const tianYue = TIAN_YUE[lunar.yearStemIdx];
  
  // 天马: 寅午戌年→申(8), 巳酉丑年→亥(11), 申子辰年→寅(2), 亥卯未年→巳(5)
  const TIAN_MA = { 2:8, 6:8, 10:8, 5:11, 1:11, 9:11, 8:2, 0:2, 4:2, 11:5, 3:5, 7:5 };
  const tianMa = TIAN_MA[lunar.yearBranchIdx];
  
  // 火星: 寅午戌年→丑卯酉... (简化，按局数定)
  const HUO_XING = [
    /*子*/1,/*丑*/9,/*寅*/6,/*卯*/3,/*辰*/4,/*巳*/11,/*午*/6,/*未*/1,/*申*/4,/*酉*/9,/*戌*/3,/*亥*/11
  ];
  const huoXing = HUO_XING[hourIdx];
  
  // 铃星: 
  const LING_XING = [11, 7, 5, 10, 4, 9, 6, 8, 1, 3, 2, 0];
  const lingXing = LING_XING[hourIdx];
  
  let auxByPos = {};
  function addAux(pos, name) {
    if(!auxByPos[pos]) auxByPos[pos] = [];
    auxByPos[pos].push(name);
  }
  addAux(zuoFu, '左輔');
  addAux(youBi, '右弼');
  addAux(wenChang, '文昌');
  addAux(wenQu, '文曲');
  addAux(tianKui, '天魁');
  addAux(tianYue, '天鉞');
  addAux(tianMa, '天馬');
  addAux(huoXing, '火星');
  addAux(lingXing, '鈴星');
  
  log('');
  log('辅星位置:');
  Object.keys(auxByPos).sort((a,b)=>a-b).forEach(k => {
    log('  ' + EARTHLY_BRANCHES[k] + '宫: ' + auxByPos[k].join(' · '));
  });
  
  // 按十二宫映射辅星
  palaces.forEach(p => {
    p.auxStars = auxByPos[p.dzIndex] || [];
  });
  
  // 2.9 四化
  // 年干四化: 甲廉破武阳(0:廉贞,破军,武曲,太阳), 乙机梁紫阴(1:天机,天梁,紫微,太阴)...
  const HUA_LU = {0:'廉貞',1:'天機',2:'天同',3:'太陰',4:'貪狼',5:'武曲',6:'太陽',7:'天梁',8:'紫微',9:'巨門'};
  const HUA_QUAN = {0:'破軍',1:'天梁',2:'天樑',3:'天同',4:'太陰',5:'天府',6:'天梁',7:'紫微',8:'左輔',9:'天機'};
  const HUA_KE = {0:'武曲',1:'紫微',2:'文昌',3:'天機',4:'右弼',5:'天梁',6:'太陰',7:'天相',8:'天機',9:'文曲'};
  const HUA_JI = {0:'太陽',1:'太陰',2:'廉貞',3:'巨門',4:'天機',5:'貪狼',6:'天同',7:'天同',8:'武曲',9:'太陰'};
  
  const huaLu = HUA_LU[lunar.yearStemIdx];
  const huaQuan = HUA_QUAN[lunar.yearStemIdx];
  const huaKe = HUA_KE[lunar.yearStemIdx];
  const huaJi = HUA_JI[lunar.yearStemIdx];
  
  log('');
  log('四化 (年干' + lunar.yearStem + '):');
  log('  化祿: ' + huaLu);
  log('  化權: ' + huaQuan);
  log('  化科: ' + huaKe);
  log('  化忌: ' + huaJi);
  
  // 映射到十二宫
  palaces.forEach(p => {
    let hua = [];
    if(starsByPos[p.dzIndex] && starsByPos[p.dzIndex].indexOf(huaLu) >= 0) hua.push(huaLu + '化祿');
    if(starsByPos[p.dzIndex] && starsByPos[p.dzIndex].indexOf(huaQuan) >= 0) hua.push(huaQuan + '化權');
    if(starsByPos[p.dzIndex] && starsByPos[p.dzIndex].indexOf(huaKe) >= 0) hua.push(huaKe + '化科');
    if(starsByPos[p.dzIndex] && starsByPos[p.dzIndex].indexOf(huaJi) >= 0) hua.push(huaJi + '化忌');
    p.fourHua = hua;
  });
  
  // 输出最终结果
  log('');
  log('╔══════════════════════════════════════════╗');
  log('║       完整排盘结果                       ║');
  log('╚══════════════════════════════════════════╝');
  log('');
  log('命宫: 地支=' + EARTHLY_BRANCHES[lifePos] + '宫, 干=' + HEAVENLY_STEMS[lifeStem] + ', 纳音=' + bureau.element + bureau.bureau + '局');
  log('身宫: 地支=' + EARTHLY_BRANCHES[bodyPos] + '宫');
  log('紫微星在: ' + EARTHLY_BRANCHES[ziWeiPos] + '宫');
  log('');
  log('十二宫完整布局:');
  palaces.forEach(p => {
    let stars = starsByPos[p.dzIndex] || [];
    let aux = p.auxStars || [];
    let starStr = stars.length ? stars.join(' · ') : '空';
    let auxStr = aux.length ? ' [辅:' + aux.join(',') + ']' : '';
    let huaStr = p.fourHua.length ? ' ✦' + p.fourHua.join(' ') : '';
    log('  ' + String(p.position+1).padStart(2) + '. ' + p.name + ' → ' + p.stemBranch + ' → ' + starStr + auxStr + huaStr);
  });
  
  // 2.10 大限
  log('');
  log('大限(简):');
  // 阳男阴女顺行，阴男阳女逆行
  // 命宫起，每宫10年
  const isMale = true;
  const isYangYear = lunar.yearStemIdx % 2 === 0; // 甲丙戊庚壬为阳
  const isForward = (isMale && isYangYear) || (!isMale && !isYangYear);
  log('  性别: ' + (isMale ? '男' : '女') + ', 年干: ' + lunar.yearStem + '(' + (isYangYear ? '阳' : '阴') + ') → 大限' + (isForward ? '顺行' : '逆行'));
  
  let age = 1;
  for(let i = 0; i < 12; i++) {
    let idx = isForward ? i : (11 - i + 1) % 12;
    let p = palaces[idx];
    log('  限' + (i+1) + ': ' + age + '-' + (age + 9) + '岁 → ' + p.name + ' (' + p.stemBranch + ')');
    age += 10;
  }
}

calculateZWDS(1988, 2, 2, 6);
