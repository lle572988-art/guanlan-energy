function renderArticleItem(article) {
  return (
    '<article class="article-item">' +
      '<a href="' + article.url + '">' +
        '<div class="article-date">' +
          '<p class="article-date-day">' + article.day + '</p>' +
          '<p class="article-date-month">' + article.month + '</p>' +
          '<p class="article-date-year">' + article.year + '</p>' +
        '</div>' +
        '<div class="article-body">' +
          '<p class="article-meta">' + article.category + ' · ' + article.readMin + ' min read</p>' +
          '<h2 class="article-title">' + article.title + '</h2>' +
          '<p class="article-excerpt">' + article.excerpt + '</p>' +
        '</div>' +
      '</a>' +
    '</article>'
  );
}

function renderFeatured(featured) {
  return (
    '<article class="featured-article">' +
      '<a href="' + featured.url + '">' +
        '<p class="featured-kicker">' + featured.kicker + '</p>' +
        '<h2 class="featured-title">' + featured.title + '<br><em>' + featured.titleAccent + '</em></h2>' +
        '<p class="featured-excerpt">' + featured.excerpt + '</p>' +
        '<span class="featured-link">Read article →</span>' +
      '</a>' +
    '</article>'
  );
}

function renderSections() {
  var root = document.getElementById('journal-sections');
  var html = '';

  SECTIONS.forEach(function(section) {
    html += '<p class="section-label">' + section.label + '</p>';
    html += '<div class="article-list">';
    if (section.featured) {
      html += renderFeatured(section.featured);
    }
    section.articles.forEach(function(article) {
      html += renderArticleItem(article);
    });
    html += '</div>';
  });

  root.innerHTML = html;
}

renderSections();
